spring.application.name=demo
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:ChangeThisToASecretKeyWithAtLeast32Chars}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}

# File storage
app.file.storage-dir=${APP_FILE_STORAGE_DIR:/tmp/insightpath/uploads}

# Upload size limit
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# AI Python service
app.ai.python-service-url=${PYTHON_SERVICE_URL:http://localhost:5001}
